name: Збірка

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core:
    name: Рушій і каталог
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Тести рушія, каталогу й профілів
        run: dotnet test tests/Kvatyrka.Core.Tests -c Release

  shell:
    name: Оболонка
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Іконки збігаються з дизайном
        shell: pwsh
        run: |
          python design/icons_cs.py
          git diff --exit-code -- shell/Kvatyrka.Shell/Ui/Icons.g.cs

      - name: Збірка без попереджень
        run: dotnet build shell/Kvatyrka.Shell -c Release

      - name: Окремий Kvatyrka.exe
        run: >
          dotnet publish shell/Kvatyrka.Shell -c Release -o publish
          -p:SelfContained=true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -p:DebugType=none

      - name: Знімки вікна, острова й панелей
        shell: pwsh
        run: |
          $p = Start-Process publish\Kvatyrka.exe -ArgumentList '--snapshot', "$PWD\snapshots" -PassThru -Wait
          if (Test-Path snapshots\hang.txt) { throw "Знімки зависли на кроці: $(Get-Content snapshots\hang.txt)" }
          if ($p.ExitCode -ne 0) { throw "Kvatyrka.exe завершилась з кодом $($p.ExitCode)" }
          Get-ChildItem snapshots
          if ((Get-ChildItem snapshots -Filter *.png).Count -lt 12) { throw 'Не всі знімки зроблено' }

      - uses: actions/upload-artifact@v5
        with:
          name: Kvatyrka
          path: publish/Kvatyrka.exe

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: snapshots
          path: snapshots/

  builder:
    name: Збирач ISO
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Синтаксис і логіка профілів
        shell: pwsh
        run: |
          $env:KV_PROFILES = "$PWD\builder\profiles"
          dotnet run --project tests/BuilderCheck -- builder/Build-Kvatyrka.ps1 tests/BuilderCheck/check.ps1

      - name: Перевірка профілів у Windows PowerShell 5.1
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force builder\shell | Out-Null
          Set-Content builder\shell\Kvatyrka.exe 'stub'
          Set-Content dummy.iso 'stub'
          foreach ($c in 'universal', 'gigant') { .\builder\Build-Kvatyrka.ps1 -Iso dummy.iso -Config $c -Check }

  release:
    name: Реліз
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [core, shell, builder]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: Kvatyrka

      - name: Kvatyrka.exe у реліз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum Kvatyrka.exe > Kvatyrka.exe.sha256
          gh release create "$GITHUB_REF_NAME" Kvatyrka.exe Kvatyrka.exe.sha256 -R "$GITHUB_REPOSITORY" --title "Кватирка ${GITHUB_REF_NAME#v}" --notes-file - <<'NOTES'
          Windows 11 без зайвого: покращення з поверненням, охоронець після оновлень, прибирання нав'язаних програм. Острів – за бажанням.

          Windows 11 without the clutter: reversible improvements, a guardian that re-applies your choices after updates, bloatware removal. Optional island taskbar.
          NOTES
